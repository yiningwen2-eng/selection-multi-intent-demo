<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-platform="web">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>选区多意图推荐 · 基于画布内 AI 编辑 Demo</title>
<!-- kd tokens（原样复制，勿改） -->
<link rel="stylesheet" href="css/tokens.css">
<!-- ribbon 复用样式（抽取自 wps-ribbon/previews，原样保留） -->
<link rel="stylesheet" href="css/ribbon.css">
<!-- 页面样式 -->
<link rel="stylesheet" href="css/app.css?v=202610">
<!-- 灵犀侧边栏样式 -->
<link rel="stylesheet" href="css/agent.css?v=20261003">
<!-- 文内 LUI 样式（划词菜单 / 输入框 / 过程面板 / 决策条） -->
  <link rel="stylesheet" href="css/lui.css?v=20261126-polish">
  <style>
    .demo-guide{
      position:fixed;left:12px;bottom:12px;z-index:9999;max-width:340px;
      background:rgba(17,24,39,.92);color:#fff;border-radius:10px;padding:10px 12px;
      font:12px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
      box-shadow:0 8px 24px rgba(0,0,0,.2);
    }
    .demo-guide b{display:block;margin-bottom:4px;font-size:13px}
    .demo-guide .muted{color:#9ca3af}
  </style>
  <script>
    (function () {
      var h = location.hash || '';
      var dwell = /(?:^|[&#])dwell=(\d+)/.exec(h);
      var hold = /(?:^|[&#])hold=(\d+)/.exec(h);
      if (dwell) window.DEMO_DWELL_MS = +dwell[1];
      if (hold) window.DEMO_LITE_HOLD_MS = +hold[1];
    })();
  </script>
</head>
<body>
  <div class="demo-guide" id="demoGuide">
    <b>选区多意图推荐 Demo</b>
    默认打开「费用台账」。<br>
    1) 框选出 icon → 约 2s <strong>延展成长条</strong>；淡入淡出收回<br>
    2) 收回后 <strong>hover icon 再出长条</strong>（不再出 tip）<br>
    3) 「写要求」/ 点 icon → 完整输入；场景推荐在下方，<strong>常用在发送钮左侧</strong><br>
    <span class="muted">#dwell=0 关延展 · #hold=8000 改展示毫秒</span>
  </div>
  <!-- 壳：顶部 doc tab 条（app.js 渲染） -->
  <div id="doc-tab-bar"></div>

  <!-- 主页视图（home.js 渲染） -->
  <main id="view-home"></main>

  <!-- 编辑器视图（editors.js 渲染，四组件共用此容器） -->
  <main id="view-editor" hidden></main>

  <!-- 弹窗挂载点（新建弹窗等） -->
  <div id="modal-root"></div>

  <script src="js/icons.js?v=20261003"></script>
  <script src="js/mock-files.js?v=20261125-multi"></script>
  <script src="js/mock/agent-scripts.js?v=202610"></script>
  <script src="js/mock/lui-scripts.js"></script>
  <script src="ribbons/wps.js"></script>
  <script src="ribbons/et.js"></script>
  <script src="ribbons/wpp.js"></script>
  <script src="ribbons/pdf.js"></script>
  <script src="js/agent.js?v=20261003"></script>
  <script src="js/ribbon-ladder.js"></script>
  <script src="js/editors.js?v=20261125-multi"></script>
  <script src="js/editor-api.js"></script>
  <script src="js/lui.js?v=20261126-polish"></script>
  <script src="js/home.js"></script>
  <script src="js/app.js?v=20261126-polish"></script>
</body>
</html>
